<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB Community Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F9FC;--top:#F7F9FC;--card:#FFFFFF;--navy:#1B376E;--chip:#E5EDF6;--line:#E3E8F0;--txt:#2B2B2B;--sub:#555B66;--mut:#7a8499;--soft:#EEF2F7;--on:#fff}
#app[data-theme=dark]{--bg:#0F1522;--top:#0F1522;--card:#18223A;--navy:#8EB2F2;--chip:#223152;--line:#2A3858;--txt:#E9EDF5;--sub:#A3AEC5;--mut:#8D99B3;--soft:#1D2944;--on:#0D1630}

*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,sans-serif}
body{color:var(--txt)}.q,.al p,.al b,.pr p,.pr .st b{color:var(--txt)}.q small,.al small,.pr .st div{color:var(--sub)}.q{font-weight:500}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,#eef2f8,#c9d3e3);display:flex;justify-content:center;align-items:center;overflow:hidden}
#phone{position:relative;flex:none;padding:12px;background:#17181d;border-radius:60px;box-shadow:0 0 0 2px #3b3c44,0 30px 70px #0006}
#phone:before,#phone:after{content:'';position:absolute;width:4px;background:#17181d;border-radius:2px}
#phone:before{right:-5px;top:210px;height:90px}#phone:after{left:-5px;top:170px;height:60px;box-shadow:0 80px 0 #17181d}
#app{position:relative;width:430px;height:932px;background:var(--bg);overflow:hidden;border-radius:48px}
.sb{position:absolute;top:0;left:0;right:0;height:48px;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 38px;font-size:15px;font-weight:600;color:var(--txt);pointer-events:none}
.sr{display:flex;gap:6px;align-items:center}
.isl{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px}
.hi{position:absolute;bottom:7px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--txt);z-index:9;opacity:.85}
.search{color:var(--navy)}.avw{position:relative}.bd{position:absolute;right:-5px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:var(--navy);color:var(--on);display:grid;place-items:center;border:2px solid var(--card)}
.post{border-radius:14px;box-shadow:0 2px 8px #1b377012}.hm,.hp{display:flex}header{padding-bottom:10px}nav{padding-bottom:12px}nav button svg{stroke-width:1.9}nav button.on svg{stroke-width:2.2}
.chip.f svg{width:16px;height:16px}.dr a svg{flex:none}
@media(max-width:480px){#phone{padding:0;background:none;border-radius:0;box-shadow:none}#phone:before,#phone:after,.isl,.sb,.hi{display:none}#app{width:100vw;height:100dvh;border-radius:0}}
header{position:absolute;top:0;left:0;right:0;height:113px;background:var(--top);display:flex;align-items:flex-end;justify-content:space-between;padding:0 21px 12px;z-index:5}
.logo{height:46px;margin-bottom:-3px}
.ib{background:none;border:0;cursor:pointer;color:var(--navy);display:flex}
main{position:absolute;top:113px;bottom:80px;left:0;right:0;overflow-y:auto;padding:0 14px 16px}
nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:var(--bg);display:flex;justify-content:space-around;padding-top:14px;z-index:5;border-top:1px solid var(--line)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);cursor:pointer;height:50px}
nav button.on{color:var(--navy);font-weight:500}
.search{margin:19px 32px 0;height:38px;border-radius:20px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;padding:0 18px}
.search input{border:0;background:none;outline:0;margin-left:10px;flex:1;font-size:14px}
.chips{display:flex;gap:10px;margin:22px -14px 0;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.chip{border:0;background:var(--chip);color:var(--navy);font-size:12px;padding:6px 15px;border-radius:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--on);font-weight:500}
.chip.f{background:var(--soft);display:flex;gap:6px;align-items:center;color:var(--sub)}
h3.t{font-size:16px;font-weight:500;margin:30px 9px 10px}
.post{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:24px}
.pu{display:flex;align-items:center;gap:10px;font-size:13px}
.av{background-size:cover!important;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;background:#fde2c4}
.av.l{width:38px;height:38px;font-size:20px}
.pu small{color:var(--mut);font-size:12px}
.cap{font-size:13px;margin:6px 0 8px;font-weight:500}
.img{height:183px;border-radius:12px;display:grid;place-items:center;font-size:76px}
.act{display:flex;align-items:center;gap:20px;margin-top:13px;font-size:12px;color:var(--navy)}
.act span{display:flex;gap:6px;align-items:center;cursor:pointer}.act .sp{flex:1}
.panel{margin:20px 0 0;height:772px;border-radius:20px;background:linear-gradient(180deg,var(--card) 0%,var(--bg) 42%,var(--chip) 100%);border:1px solid var(--line);box-shadow:0 1px 6px #0001;padding:30px 16px;position:relative}
.panel h2{color:var(--navy);font-weight:500;font-size:20px;line-height:1.25}
.panel h2 span{display:block;font-weight:400;font-size:20px}
.tabs{display:flex;gap:12px;margin:26px -4px 0}
.tabs button{flex:1;border:0;background:var(--chip);color:var(--navy);font-size:14px;padding:12px 0;border-radius:6px;cursor:pointer;box-shadow:0 1px 3px #0001}
.tabs button.on{background:var(--navy);color:var(--on)}
.lbl{font-size:14px;font-weight:500;margin-top:24px;color:var(--txt)}
.pl .lbl{color:var(--navy)}
.ul{width:100%;border:0;border-bottom:1px solid var(--txt);background:none;outline:0;height:50px;font-size:14px}
.tag{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--navy);margin-top:22px}
.tag input{border:0;background:none;outline:0;font-size:12px;flex:1;color:var(--navy)}
.sel{margin-top:22px;display:inline-flex;align-items:center;gap:20px;background:var(--card);box-shadow:0 2px 6px #0003;border-radius:8px;padding:10px 12px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;position:relative}
.dd{position:absolute;top:100%;left:0;margin-top:4px;background:var(--card);border-radius:14px;box-shadow:0 4px 14px #0003;z-index:3;width:200px;overflow:hidden}
.dd div{padding:10px 14px;font-weight:400;font-size:13px}.dd div:hover{background:var(--chip)}
.up{background:var(--chip);border:1px solid var(--line);border-radius:8px;height:130px;margin-top:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--navy);font-size:13px;font-weight:500;cursor:pointer}
.th{display:flex;gap:12px;margin-top:10px}
.th div{position:relative;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:22px;background:#e8cfae}
.th b{position:absolute;top:-2px;right:2px;font-size:11px;color:var(--navy);cursor:pointer}
.bt{position:absolute;left:24px;right:24px;display:block;height:41px;border-radius:3px;font-size:14px;cursor:pointer;letter-spacing:.3px}
.b1{bottom:150px;background:var(--soft);border:1px solid var(--line);color:var(--navy)}
.b2{bottom:90px;background:var(--navy);border:0;color:var(--on)}
.ta{width:100%;border:0;border-bottom:1px solid var(--txt);background:none;outline:0;font-size:14px;resize:none;height:80px;padding-top:10px}
.drawer{position:absolute;inset:0;z-index:20;background:#0004;display:none}
.drawer.on{display:block}
.dr{width:300px;margin-top:113px;background:var(--chip);border-radius:0 12px 12px 0;padding:46px 24px 14px;box-shadow:0 4px 14px #0003}
.dr a{display:flex;gap:10px;align-items:center;font-size:18px;color:var(--navy);padding:0 0 22px 0;cursor:pointer;margin-bottom:0}
.dr .eb,.dr .lo{display:block;width:100%;height:24px;border-radius:12px;font-size:14px;margin-top:10px;cursor:pointer}
.eb{background:var(--soft);border:1px solid var(--navy);color:var(--navy)}.lo{background:var(--navy);border:0;color:var(--on)}
.al{display:flex;gap:12px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);font-size:13px;position:relative;cursor:pointer}
.al.un{background:var(--chip)}
.al p{flex:1;line-height:1.4}.al small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.al .th2{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:22px;background:#e8cfae}
.dot{width:8px;height:8px;border-radius:50%;background:var(--navy)}
.pr{text-align:center;padding-top:26px}
.pr .big{width:96px;height:96px;border-radius:50%;margin:0 auto;border:3px solid var(--navy);cursor:pointer}
.pr h2{color:var(--navy);font-weight:500;font-size:20px;margin-top:14px}.pr p{font-size:13px;color:var(--mut);margin-top:2px}
.st{display:flex;margin:22px 0;background:var(--card);border:1px solid var(--line);border-radius:4px}
.st div{flex:1;padding:12px 0;font-size:12px;color:var(--mut)}.st b{display:block;font-size:18px;font-weight:500;color:var(--navy)}
.pr .btn2{display:flex;gap:12px;margin:0 8px}.pr .btn2 button{flex:1;height:41px;border-radius:3px;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.grid div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:38px}
.q{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:10px;font-size:13px}.q small{display:block;color:var(--mut);margin-top:4px;font-size:11px}
#toast{position:absolute;left:50%;top:126px;transform:translate(-50%,-20px);background:var(--navy);color:var(--on);font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

:where(#app *){transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease}
button{transition:background-color .25s,color .25s,border-color .25s,transform .15s,opacity .2s}button:active{transform:scale(.95)}
input,textarea{color:var(--txt)}::placeholder{color:var(--mut)}
.search{background:var(--card);box-shadow:0 1px 6px #1b376e10}
.chip{border-radius:22px;padding:8px 17px}.chip.f{color:var(--navy)}.chip.f.on{background:var(--navy);color:var(--on)}
.chip.f .cnt{background:var(--on);color:var(--navy);width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.tabs button,.bt,.pr .btn2 button,.eb,.lo{border-radius:24px}.bt{height:44px}.b2{box-shadow:0 6px 16px #1b376e33}
.sel{border-radius:20px}.panel{border-radius:28px}.post{background:var(--card);border-radius:20px;box-shadow:0 2px 12px #1b376e12;border-color:transparent}.st,.q,.al-box{border-radius:16px}.up{border-radius:18px;border-style:dashed;border-color:var(--navy)}.th div{border-radius:12px}
.drawer{display:block;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.drawer.on{opacity:1;visibility:visible}
.dr{transform:translateX(-100%);transition:transform .4s cubic-bezier(.2,.8,.2,1),background-color .4s}.drawer.on .dr{transform:none}
.dr .eb,.dr .lo{height:36px;border-radius:18px}.dr a:active{opacity:.6}
.dr .thm{margin-top:30px;padding-bottom:20px}.sw{margin-left:auto;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background-color .3s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.sw.on{background:var(--navy)}.sw.on:after{transform:translateX(20px)}
.thi{display:flex}
#app[data-theme=dark] .logo{filter:brightness(0) invert(.92)}
.img,.qb{position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.qb{height:100px;border-radius:16px;background:var(--chip);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px}
.tg{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:500;background:var(--chip);color:var(--navy);padding:3px 11px;border-radius:12px}
.lk{display:flex}.lk.on svg{animation:pawpop .4s cubic-bezier(.2,.8,.2,1)}
.pop{position:absolute;left:50%;top:50%;margin:-52px 0 0 -52px;pointer-events:none;display:flex;animation:popk .95s ease forwards}
.pop svg{fill:var(--navy);stroke:#fff;filter:drop-shadow(0 4px 14px #0005)}
@keyframes popk{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.25);opacity:1}38%{transform:scale(.94)}55%{transform:scale(1.03);opacity:1}100%{transform:scale(1.15) translateY(-12px);opacity:0}}
@keyframes pawpop{0%{transform:scale(.6)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.enter>:nth-child(2){animation-delay:.05s}.enter>:nth-child(3){animation-delay:.1s}.enter>:nth-child(n+4){animation-delay:.15s}
.sheet{position:absolute;inset:0;z-index:25;background:#0006;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.sheet.on{opacity:1;visibility:visible}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:12px 22px 38px;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1),background-color .4s}.sheet.on .sh{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sht{display:flex;justify-content:space-between;align-items:center}.sht h3{font-size:19px;font-weight:500;color:var(--navy)}.rs{background:none;border:0;color:var(--navy);font-size:13px;cursor:pointer}
.fl{font-size:13px;font-weight:500;margin:22px 0 10px;color:var(--txt)}.ops{display:flex;flex-wrap:wrap;gap:8px}.ops .chip{font-size:13px}
.bt2{width:100%;height:46px;border-radius:23px;border:0;background:var(--navy);color:var(--on);font-size:14px;margin-top:28px;cursor:pointer;box-shadow:0 6px 16px #1b376e33}
.empty{text-align:center;padding:70px 20px;color:var(--navy)}.empty p{margin:12px 0 18px;font-size:13px;color:var(--sub)}

/* typography + shop */
button{font-weight:500}.chip{font-size:12.5px;font-weight:500}h3.t{font-size:18px;font-weight:500;color:var(--txt)}.pu small,.al small,.q small,.st div,.pr p{font-size:11.5px}.post .cap{font-size:13.5px}nav button{font-size:11.5px;font-weight:400}nav button.on{font-weight:500}#main{padding-bottom:100px}
.stt{text-align:center;padding-top:22px}.stt h2{font-size:20px;font-weight:500;color:var(--txt)}.stt p{display:flex;gap:4px;justify-content:center;align-items:center;font-size:13px;color:var(--sub);margin-top:2px}.stt p svg{color:var(--navy)}
.srow{display:flex;gap:12px;align-items:center;margin:18px 4px 0}.srow .search{height:46px;border-radius:24px}.fb{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--navy);display:grid;place-items:center;box-shadow:0 1px 6px #1b376e14;cursor:pointer;position:relative;flex:none}.fb.on{background:var(--navy);color:var(--on)}.fb .cnt{position:absolute;top:-3px;right:-3px;background:var(--card);color:var(--navy);border:1.5px solid var(--navy);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600}
.sh2{margin:30px 4px 14px;display:flex;justify-content:space-between;align-items:baseline}.sh2 small{font-size:12px;font-weight:400;color:var(--sub)}
.hero{position:relative;overflow:hidden;margin-top:24px;padding:22px 20px;border-radius:24px;background:linear-gradient(135deg,#1B376E,#2D5199);color:#fff;box-shadow:0 12px 28px #1b376e44}.hero>div{position:relative;z-index:1}.hero small{font-size:11px;font-weight:500;letter-spacing:1px;opacity:.75}.hero h4{font-size:18px;font-weight:500;line-height:1.35;margin:8px 0 16px;max-width:220px}.hero button{border:0;border-radius:20px;padding:9px 18px;background:#E5EDF6;color:#1B376E;font-size:12.5px;cursor:pointer}.hero>svg{position:absolute;right:-12px;bottom:-20px;opacity:.16;color:#fff}.hero:after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#ffffff30,transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -14px;padding:4px 14px 20px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs .pc{flex:none;width:164px;scroll-snap-align:start}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tl{text-align:center;cursor:pointer}.tl div{aspect-ratio:76/90;border-radius:18px;box-shadow:0 3px 10px #1b376e1a;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.tl:hover div{transform:translateY(-3px);box-shadow:0 10px 20px #1b376e2a}.tl:active div{transform:scale(.96)}.tl span{display:block;margin-top:8px;font-size:12px;line-height:1.35;color:var(--txt)}.va{display:block;text-align:right;font-size:12.5px;color:var(--navy);text-decoration:underline;margin:14px 4px 0;cursor:pointer}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pc{min-width:0;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 2px 12px #1b376e12;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background-color .4s}.pc:hover{transform:translateY(-3px);box-shadow:0 12px 26px #1b376e24}
.pi{position:relative;height:128px;border-radius:16px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}.pi:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-100%);transition:transform .8s;pointer-events:none}.pc:hover .pi:after{transform:translateX(100%)}.pi .pop{margin:-42px 0 0 -42px}
.hrt{position:absolute;top:8px;right:8px;z-index:1;width:30px;height:30px;border-radius:50%;border:0;background:#ffffffd9;backdrop-filter:blur(6px);color:#1B376E;display:grid;place-items:center;cursor:pointer}.pt{position:absolute;z-index:1;left:8px;top:8px;font-style:normal;font-size:10.5px;font-weight:500;background:#ffffffd9;color:#1B376E;padding:4px 10px;border-radius:12px}
.pn{font-size:13px;font-weight:500;margin-top:10px;line-height:1.3;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}.pb{font-size:11.5px;color:var(--sub);margin-top:2px}
.pm{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px}.rt{display:flex;gap:3px;align-items:center;color:var(--navy);font-weight:500}.stg{color:var(--sub)}
.pp{margin-top:6px;display:flex;align-items:baseline;gap:4px}.pp b{font-size:15px;font-weight:600;color:var(--navy)}.pp small{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:100%;height:36px;margin-top:10px;border-radius:18px;border:0;background:var(--navy);color:var(--on);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px #1b376e30}.add span{font-size:16px;line-height:1}
.stp{display:flex;align-items:center;justify-content:space-between;height:36px;margin-top:10px;border-radius:18px;background:var(--chip);padding:0 4px}.stp button{width:28px;height:28px;border-radius:50%;border:0;background:var(--navy);color:var(--on);font-size:16px;cursor:pointer;line-height:1}.stp b{font-size:13px;font-weight:600;color:var(--navy)}.stp.sm{margin:0;width:94px;flex:none}

function dblp(e,i){const el=e.currentTarget,o=document.createElement('i');o.className='pop';o.innerHTML=ic('paw',84,1.3,'currentColor');el.appendChild(o);setTimeout(()=>o.remove(),950);S.wish[i]=true;const b=el.querySelector('.hrt');b.classList.add('on');b.innerHTML=ic('srv',18,1.8,'currentColor')}
const addH=p=>{const q=S.cart[p.id]||0;return q?`<div class="stp"><button onclick="cadd(${p.id},-1)">−</button><b>${q}</b><button onclick="cadd(${p.id},1)">+</button></div>`:`<button class="add" onclick="cadd(${p.id},1)">Add to Cart <span>+</span></button>`};
const pcH=p=>`<div class="pc"><div class="pi" style="background:${bi(p.img)}" ondblclick="dblp(event,${p.id})"><button class="hrt ${S.wish[p.id]?'on':''}" onclick="event.stopPropagation();wish(${p.id})">${ic('srv',18,1.8,S.wish[p.id]?'currentColor':'none')}</button>${p.pet!='both'?`<em class="pt">${p.pet=='dog'?'Dogs':'Cats'}</em>`:''}</div><div class="pn">${p.n}</div><div class="pb">${p.brand}</div><div class="pm"><span class="rt">${ic('star',13,1.6,'currentColor')}${p.rate}</span><span class="stg">${p.stage}</span></div><div class="pp"><b>${inr(p.price)}</b><small>/ ${p.unit}</small></div>${addH(p)}</div>`;
const emp=`<div class="empty">${ic('paw',44,1.5)}<p>No products match these filters</p><button class="chip on" onclick="rsf()">Clear filters</button></div>`;
function sbody(){const n=fc();if(S.sc!='All'||S.sq||n){const r=pf(SB[S.sc]||(()=>1));return `<h3 class="t sh2">${S.sq?'Search results':S.sc=='All'?'Filtered Products':S.sc}<small>${r.length} products</small></h3>${r.length?`<div class="pg">${r.map(pcH).join('')}</div>`:emp}`}
return `<div class="hero"><div><small>PREMIUM CARE FOR ${PD[S.cp].n.toUpperCase()}</small><h4>Free delivery on orders above ₹499</h4><button onclick="toast('Code PAWS10 applied')">Use code PAWS10</button></div>${ic('paw',130,1.2)}</div><h3 class="t sh2">Featured Products</h3><div class="hs">${PR.filter(p=>p.rate>=4.8).slice(0,6).map(pcH).join('')}</div>${G.map((g,gi)=>`<div class="grp"><h3 class="t sh2">${g[0]}</h3><div class="tiles">${g[1].map((s,si)=>`<div class="tl" onclick="openList(${gi},${si})"><div style="background:${bi('p'+(gi*4+si))}"></div><span>${s[0]}</span></div>`).join('')}</div><a class="va" onclick="openList(${gi},-1)">View All &gt;</a></div>`).join('')}`}
function shop(){const n=fc();return `<div class="stt"><h2>Shop for ${PD[S.cp].n}</h2><p>${ic('pin',15,2)} Pune, Kondhwa</p></div><div class="srow"><div class="search" style="margin:0;flex:1">${I.srch}<input placeholder="Search for products" value="${S.sq}" oninput="qs(this.value)"></div><button class="fb ${n?'on':''}" onclick="sheet(1,'s')" aria-label="Filters">${I.filt}${n?`<b class="cnt">${n}</b>`:''}</button></div><div class="chips">${['All','Dogs','Cats','Food','Treats','Toys','Grooming','Health','Clothes'].map(c=>`<button class="chip ${S.sc==c?'on':''}" onclick="sc('${c}')">${c}</button>`).join('')}</div><div id="sbody">${sbody()}</div>`}
function qs(v){S.sq=v;$('#sbody').innerHTML=sbody()}
function sc(c){const pt=['Dogs','Cats'];if(pt.includes(c))S.pet=c;else if(pt.includes(S.sc))S.pet='All Pets';S.sc=c;render(1)}
function setPet(c){S.pet=c;if(['All','Dogs','Cats'].includes(S.sc))S.sc=c=='All Pets'?'All':c;render()}
function openList(g,s){S.g=g;S.sub=s;go('list')}
function list(){const g=G[S.g],it=pf(p=>p.g==S.g&&(S.sub<0||p.s==S.sub)),n=fc();return `<div class="lh"><button class="bk" onclick="go('shop')" aria-label="Back">${ic('back',20,2)}</button><div><h2>${S.sub<0?g[0]:g[1][S.sub][0]}</h2><p>${g[0]}</p></div></div><div class="chips"><button class="chip ${S.sub<0?'on':''}" onclick="S.sub=-1;render(1)">All</button>${g[1].map((s,i)=>`<button class="chip ${S.sub==i?'on':''}" onclick="S.sub=${i};render(1)">${s[0]}</button>`).join('')}</div><div class="chips" style="margin-top:12px">${PETS.map(c=>`<button class="chip ${S.pet==c?'on':''}" onclick="setPet('${c}')">${c}</button>`).join('')}<button class="chip f ${n?'on':''}" onclick="sheet(1,'s')">${I.filt}Filter${n?`<b class="cnt">${n}</b>`:''}</button></div><p class="cnt2">${it.length} products</p>${it.length?`<div class="pg">${it.map(pcH).join('')}</div>`:emp}`}
function shopSheet(){const f=S.sf,N=(S.scr=='list'?pf(p=>p.g==S.g&&(S.sub<0||p.s==S.sub)):pf(SB[S.sc]||(()=>1))).length;const row=(t,cur,o,k)=>`<div class="fl">${t}</div><div class="ops">${o.map(x=>`<button class="chip ${cur==x?'on':''}" onclick="ss('${k}','${x}')">${x}</button>`).join('')}</div>`;
return `<div class="grab"></div><div class="sht"><h3>Filters</h3><button class="rs" onclick="rsf()">Reset</button></div>${row('Pet',S.pet,PETS,'pet')}${row('Sort by',f.sort,['Popular','Price: Low to High','Price: High to Low'],'sort')}${row('Price',f.price,['Any','Under ₹300','₹300 – ₹700','Above ₹700'],'price')}${row('Life stage',f.stage,['Any','Puppy/Kitten','Adult','Senior'],'stage')}${row('Rating',f.rate,['Any','4.5 & above'],'rate')}<button class="bt2" onclick="sheet(0)">Show ${N} product${N==1?'':'s'}</button>`}
function ss(k,x){if(k=='pet')setPet(x);else{S.sf[k]=x;render()}$('#shc').innerHTML=shopSheet()}
function rsf(){S.pet='All Pets';S.sf={sort:'Popular',price:'Any',stage:'Any',rate:'Any'};if(['Dogs','Cats'].includes(S.sc))S.sc='All';$('#shc').innerHTML=shopSheet();render()}
function cartH(){const t=ct(),d=t>=499?0:40,e=!cq();const rows=Object.entries(S.cart).map(([i,q])=>{const p=PR[i];return `<div class="cr"><div class="ci" style="background:${bi(p.img)}"></div><div class="cm"><b>${p.n}</b><small>${p.brand} · ${inr(p.price)}</small></div><div class="stp sm"><button onclick="cadd(${i},-1)">−</button><b>${q}</b><button onclick="cadd(${i},1)">+</button></div></div>`}).join('');
return `<div class="grab"></div><div class="sht"><h3>Your Cart</h3>${e?'':`<button class="rs" onclick="S.cart={};render();csheet(1)">Clear</button>`}</div>${e?`<div class="empty">${ic('cart',44,1.5)}<p>Your cart is empty</p><button class="chip on" onclick="csheet(0)">Continue shopping</button></div>`:`${rows}<div class="sm2"><span>Subtotal</span><b>${inr(t)}</b></div><div class="sm2"><span>Delivery</span><b>${d?inr(d):'Free'}</b></div><div class="sm2 tt"><span>Total</span><b>${inr(t+d)}</b></div><button class="bt2" onclick="csheet(0);S.cart={};render();toast('Order placed! 🐾')">Checkout · ${inr(t+d)}</button>`}`}
function csheet(o){if(o)$('#csh').innerHTML=cartH();$('#csheet').classList.toggle('on',!!o)}
function cbar(){const q=cq(),el=$('#cb');el.classList.toggle('on',!!q&&['shop','list','phome'].includes(S.scr));if(q)el.innerHTML=`<span class="cbi">${ic('cart',20,1.8)}<b>${q}</b></span><span class="cbt">${q} item${q>1?'s':''}<small>${inr(ct())}</small></span><span class="cbv">View Cart ${ic('back',15,2)}</span>`}

S.cp=PD.length-1;S.hs=p.sp;S.ha=p.ag;feedAdd('paw',n+' was added to your pets');csheet(0);toast(n+' added');render()}
function dsync(){if(S.sy)return;S.sy=1;render();setTimeout(()=>{S.sy=0;S.sd='just now';feedAdd('cal','Appointments synced');render();toast('Appointments synced')},1100)}
function trref(){if(S.trs)return;S.trs=1;render();setTimeout(()=>{S.trs=0;S.tru='Updated just now';render();toast('Training updates refreshed')},900)}
function reb(id){const b=S.bks.find(x=>x.id==id),p=SV.find(x=>x.n==b.prov);if(p){psheet(p.id);S.resched={id,pid:p.id}}else toast('Provider not found')}
const _wf=wfin;wfin=function(){_wf();const r=S.w.res;if(r)feedAdd('walk',PD[S.cp].n+' completed a '+r.min+' min walk ('+r.km.toFixed(1)+' km)')};
const _bc=bcancel;bcancel=function(id){const b=S.bks.find(x=>x.id==id);_bc(id);feedAdd('x',b.svc+' with '+b.prov+' was cancelled')};
const _ad=addDocs;addDocs=function(i){const n=i.files.length;_ad(i);feedAdd('file',n+' document'+(n>1?'s':'')+' added to the vault')};
const _cb2=confirmBook;confirmBook=function(){_cb2();const r=S.r,pn=S.bk.pet;feedAdd('cal',r.cat+' booked with '+r.prov.n);if(r.cat=='Training')S.tr[pn]={plan:r.opt,prov:r.prov.n,done:0,total:8,next:r.a.split(',').slice(0,2).join(',')+' · '+r.tm,skills:[['Sit',0],['Stay',0],['Recall',0]]}};
const bkH=b=>`<div class="bk2"><i class="bi">${ic(SC[Math.max(0,SC.findIndex(s=>s[0]==b.svc))][2],20,1.7)}</i><div class="bm"><b>${b.svc} · ${b.prov}</b><span>${ic('cal',13,1.8)} ${b.date} · ${b.tm}</span><span>${inr(b.amt)} · ${b.id}</span>${b.st=='up'?`<div class="bac"><button onclick="reb('${b.id}')">Reschedule</button><button class="x" onclick="bcancel('${b.id}')">Cancel</button></div>`:b.st=='can'?`<span>${b.note||'Cancelled by you'}</span>`:''}</div><em class="stb s-${b.st}">${{up:'Confirmed',done:'Completed',can:'Cancelled'}[b.st]}</em></div>`;
function dash(){const pt=PD[S.cp],V=VAC[pt.n],vd=V.filter(v=>v[2]=='done').length,bk=S.bks.filter(b=>b.pet==pt.n),up=bk.filter(b=>b.st=='up'),dn=bk.filter(b=>b.st=='done'),cn=bk.filter(b=>b.st=='can'),wk=S.wk[pt.n],wm=wk.reduce((a,b)=>a+b,0),goal=pt.sp=='dog'?210:90,mx=Math.max(60,...wk),tbv=S.tb=='can'?'can':'done',cl=tbv=='can'?cn:dn,tr=S.tr[pt.n],all=S.docs.filter(d=>d.pet==pt.n),vl=all.filter(d=>S.dc=='All'||d.cat==S.dc);
const pend=S.bks.filter(b=>b.st=='up').length,vdue=Object.values(VAC).reduce((a,v)=>a+v.filter(x=>x[2]=='due').length,0),hr=new Date().getHours(),gt=hr<12?'Good Morning':hr<17?'Good Afternoon':'Good Evening';
const st=(i,n,l,id)=>`<button class="sc2" onclick="sj('${id}')"><i>${ic(i,18,1.8)}</i><b class="ser">${n}</b><span>${l}</span></button>`;
const sec=(id,t,r,body)=>`<div class="dc" id="${id}"><div class="dh2"><h3 class="ser">${t}</h3>${r||''}</div>${body}</div>`;
const petsBody=PD.length?PD.map((p,i)=>{const Vp=VAC[p.n],vp=Vp.filter(v=>v[2]=='done').length,nx=S.bks.find(x=>x.pet==p.n&&x.st=='up');return `<div class="pc2 ${S.cp==i?'on':''}" onclick="sp(${i})"><div class="pa2" style="background:${bi(p.img)}"></div><div class="pn2"><b class="ser">${p.n}</b><span>${p.breed}</span><span>${p.age} · ${p.kg} kg</span><div class="tg3"><i>${vp}/${Vp.length} vaccines</i>${nx?`<i>Next · ${nx.date.split(' – ')[0].replace(' 2026','')}</i>`:''}</div></div><div class="pcr">${ring(pscore(p),54)}<em>${S.cp==i?'Viewing':'View'}</em></div></div>`}).join(''):`<div class="empb">${ic('paw',40,1.5)}<p>No pets yet</p><button class="bt4" onclick="apet()">${ic('plus',16,2)} Add Your First Pet</button></div>`;
return `<div class="dsh"><div class="dc gc"><h2 class="ser gh">${gt}, ${OWN.n} ${ic('theme',20,1.8)}</h2><p>Manage your pets, appointments and health in one place.</p><div class="gch"><button class="gp" onclick="sj('upc')">${ic('cal',14,1.9)} ${pend} Appointments</button><button class="gp" onclick="sj('vacc')">${ic('vet',14,1.9)} ${vdue} Pending Vaccines</button><button class="gp" onclick="sj('vlt')">${ic('file',14,1.9)} ${all.length} Documents</button></div><div class="gb"><button class="bt4" onclick="go('vault')">${ic('file',16,1.9)} Document Vault</button><button class="bt4 o" onclick="go('walk')">${ic('walk',16,1.9)} Walk Your Pet</button></div></div>
<div class="sg">${st('paw',PD.length,'Total Pets','mypets')}${st('vet',vdue,'Vaccines Due','vacc')}${st('clock',pend,'Pending Appt','upc')}${st('cal',S.bks.length,'Total Appointments','cmp')}</div>
<div style="margin:6px 0 -6px">${petChips()}</div>
${sec('vacc','Vaccination Overview',`<span class="pill">${pt.n} · ${vd}/${V.length}</span>`,V.length?`<div class="bar2"><div><span>Completed</span><b>${vd} of ${V.length}</b></div><div class="tr"><i style="width:${Math.round(vd/V.length*100)}%"></i></div></div><div class="tvl">${V.map(v=>`<div class="tv ${v[2]=='up'?'nxt':v[2]}"><i>${v[2]=='done'?ic('chk',12,3.2):''}</i><div><b>${v[0]}</b><span>${v[1]}</span></div>${v[2]=='due'?`<button class="mini" onclick="openSvc(3)">Book vet</button>`:`<em class="stb ${v[2]=='done'?'s-done':''}">${{done:'Completed',up:'Upcoming'}[v[2]]}</em>`}</div>`).join('')}</div>`:'<p class="emp">No vaccinations found</p>')}
${sec('upc','Upcoming Timeline',`<span class="pill">${up.length} upcoming</span>`,(up.length?up.map(bkH).join(''):'<p class="emp">No appointments</p>')+`<button class="bt4 o full" onclick="go('svc')">${ic('plus',16,2)} Book a service</button>`)}
${sec('cmp',(tbv=='can'?'Cancelled':'Completed')+' Bookings',`<span class="pill">${bk.length} total</span>`,`<div class="seg" style="margin:4px 0 14px"><i style="flex:${dn.length};background:var(--navy)"></i><i style="flex:${up.length};background:#8EB2F2"></i><i style="flex:${cn.length};background:#C9CFDA"></i></div><div class="vtl"><button class="chip ${tbv=='done'?'on':''}" onclick="S.tb='done';render()">Completed · ${dn.length}</button><button class="chip ${tbv=='can'?'on':''}" onclick="S.tb='can';render()">Cancelled · ${cn.length}</button></div>${cl.length?cl.map(bkH).join(''):`<p class="emp">No ${tbv=='can'?'cancelled':'completed'} appointments</p>`}`)}
${sec('feed','Activity Feed','',S.feed.length?S.feed.slice(0,6).map(f=>`<div class="af"><i>${ic(f.i,16,1.8)}</i><div><b>${f.t}</b><small>${f.w}</small></div></div>`).join(''):'<p class="emp">No recent activity</p>')}
${sec('trn','Training Updates',`<button class="mini o ${S.trs?'spin':''}" onclick="trref()">${S.trs?'Refreshing…':'Refresh'}</button>`,tr?`<div class="bar2"><div><span>${tr.plan} · ${tr.prov}</span><b>${tr.done}/${tr.total} sessions</b></div><div class="tr"><i style="width:${Math.round(tr.done/tr.total*100)}%"></i></div></div><p class="syn" style="margin:10px 0 12px">Next session · ${tr.next}</p>${tr.skills.map(k=>`<div class="bar2" style="margin-top:10px"><div><span>${k[0]}</span><b>${k[1]}%</b></div><div class="tr"><i style="width:${k[1]}%"></i></div></div>`).join('')}<p class="syn" style="margin-top:12px">${S.tru}</p>`:`<p class="emp">No active training plans.</p><button class="bt4 o full" onclick="openSvc(4)">Find a trainer</button><p class="syn" style="margin-top:10px">${S.tru}</p>`)}
${sec('vlt',pt.n+"'s Document Vault",`<span class="pill">${all.length} files</span>`,`<div class="vtl">${['All',...DC].map(x=>`<button class="chip ${S.dc==x?'on':''}" onclick="S.dc='${x}';render()">${x}</button>`).join('')}</div><input type="file" id="fu2" multiple hidden onchange="addDocs(this)"><div class="upl" onclick="$('#fu2').click()">${ic('up2',18,2)} Upload a document</div>${vl.length?vl.slice(0,4).map(d=>`<div class="doc" onclick="vdoc(${d.id})"><i class="dic">${ic('file',22,1.6)}<b>${exts(d.n)}</b></i><div><b class="nm">${esc(d.n)}</b><span>${d.cat} · ${d.date}</span></div><button class="dx" onclick="event.stopPropagation();ddel(${d.id})" aria-label="Delete">${ic('trash',17,1.7)}</button></div>`).join(''):`<p class="emp" style="margin-top:12px">No ${S.dc=='All'?'':S.dc.toLowerCase()+' '}documents yet</p>`}<button class="bt4 full" onclick="go('vault')">${ic('file',16,1.9)} Open Document Vault${vl.length>4?' · '+vl.length+' files':''}</button>`)}
${sec('wkx','Activity This Week',`<span class="pill">${wm} / ${goal} min</span>`,`<div class="wkc">${wk.map((m,i)=>`<div class="wc ${i==5?'t':''}"><div class="wb"><i style="height:${Math.max(4,Math.round(m/mx*100))}%;animation-delay:${i*.05}s"></i></div><span>${'MTWTFSS'[i]}</span></div>`).join('')}</div><button class="bt4 full" onclick="go('walk')">${ic('walk',16,1.9)} Walk ${pt.n}</button>`)}

const _cb3=confirmBook;confirmBook=function(){const rs=S.resched,pid=S.bk&&S.bk.pid;_cb3();if(rs&&rs.pid==pid){const o=S.bks.find(x=>x.id==rs.id);if(o){o.st='can';o.note='Rescheduled to '+S.bks[0].date;feedAdd('cal',o.svc+' rescheduled to '+S.bks[0].date)}}S.resched=null};
